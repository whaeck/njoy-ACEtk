stages:
  - ci_downstream
  - check_ok

trigger_ci_downstream:
  stage: ci_downstream

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PARENT_MR_ID: $CI_MERGE_REQUEST_IID
    - if: '$CI_PIPELINE_SOURCE == "push"'
      variables:
        REF_BRANCH: $CI_COMMIT_REF_NAME
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        REF_BRANCH: $CI_COMMIT_REF_NAME
    - if: '$DEPLOY_CODE == "1" || $DEPLOY_CODE == "2"'
      variables:
        DEPLOY_CODE_PASS: $DEPLOY_CODE


  trigger:
    project: NJOY/common_ci
    branch: rocinante_deployment
    strategy: depend

  variables:
    MERGE_TYPE: $CI_PIPELINE_SOURCE
    PARENT_MR_ID: "$CI_MERGE_REQUEST_IID"
    PROJECT_ROOT_NAME: "ACEtk"
    PROJECT_LIB_NAME: "ACEtk"
    PROJECT_TEST_OPTION: "ACEtk.tests"

check:
  stage: check_ok

  artifacts:
    expire_in: 30d

  id_tokens:
    SITE_ID_TOKEN:
      aud: https://asc-git.lanl.gov
    CI_JOB_JWT:
      aud: https://asc-git.lanl.gov/

  script:
    - printenv
    - echo "Looks good..."
